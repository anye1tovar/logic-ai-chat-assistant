[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-escape-room-assistant"
version = "0.1.0"
description = "Backend skeleton for the Logic Escape Room conversational assistant."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.19,<5.0",
    "cachetools>=5.5,<7.0",
    "chromadb>=0.6,<2.0",
    "openai>=1.60,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
